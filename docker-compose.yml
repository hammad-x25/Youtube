services:

  nginx:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend

  backend:
    build: ./backend
    env_file:
      - ./backend/.env
    expose:
      - "8000"
    depends_on:
      - mongodb

  mongodb:
    image: mongo:8
    volumes:
      - mongodb_data:/data/db

volumes:
  mongodb_data: